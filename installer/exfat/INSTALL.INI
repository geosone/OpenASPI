; exFAT package of OpenASPI for GeosOne DOS Installer (GDI), GPL version 3.
; The same files and CONFIG.SYS line as the exFAT option of the OpenASPI
; package (installer/INSTALL.INI).  With OpenASPI installed its exFAT option
; is the way (Conflicts=: Setup asks, Cancel by default); OpenASPI installed
; over this package replaces its EXFAT.SYS line.  INSTALL /U of either
; removes every EXFAT.SYS line (Remove=).
[Setup]
Title=exFAT Setup
Product=GeosOne OpenASPI exFAT 0.4
Id=EXFAT
Conflicts=OPENASPI
Version=0.4
License=LICENSE.TXT
Readme=README.TXT
DefaultDir=%BOOT%\EXFAT
Done=exFAT is installed. Restart the computer to load EXFAT.SYS.

[Welcome]
EXFAT.SYS gives exFAT volumes DOS drive letters: hard disks and USB sticks
through the BIOS, and with OpenASPI the exFAT media of ASPIDSK and ASPIFDD.
It reads and writes. EXFMT formats exFAT, EXCHK checks and repairs it.

With OpenASPI (ASPIDSK, ASPIFDD), EXFAT.SYS must come after these drivers
in CONFIG.SYS.

[Options]
Option=on|Load EXFAT.SYS in CONFIG.SYS
Option=off|Load it into upper memory (DEVICEHIGH)|HIGH
Option=off|Long file names for LFN programs (8 KB more)

[Files]
README.TXT=EXFAT.TXT
LICENSE.TXT
; one of the two drivers, both installed as EXFAT.SYS
!3|EXFAT.SYS
3|EXFATL.SYS=EXFAT.SYS
EXFMT.EXE
EXCHK.EXE

[Config.sys]
Remove=EXFAT.SYS
Add=1|DEVICE%O2%=%DIR%\EXFAT.SYS
Position=bottom
