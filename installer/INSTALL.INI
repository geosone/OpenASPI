; OpenASPI package for GeosOne DOS Installer (GDI), GPL version 3.
[Setup]
Title=OpenASPI Setup
Product=GeosOne OpenASPI 0.1
Id=OPENASPI
License=LICENSE.TXT
Readme=README.TXT
; the drivers in C:\OPENASPI with AHCIASPI and EUSBASPI; this installer
; and its journals in C:\OPENASPI\ASPI
DefaultDir=%BOOT%\OPENASPI
SetupDir=ASPI
Done=OpenASPI is installed. Restart the computer to load the selected drivers.

[Welcome]
OpenASPI provides DOS device drivers for disks, removable media, CD/DVD and
SCSI tape drives attached through an ASPI manager such as AHCIASPI, EUSBASPI
or an Adaptec ASPI manager.

Install an ASPI manager before these device drivers in CONFIG.SYS.

[Options]
Option=?TAPE|Tape drives: ASPITAP.SYS
Option=?DISK|Disks: ASPIDSK.SYS (when present)
Option=?FDD|LS-120, ZIP and removable media: ASPIFDD.SYS (when present)
Option=?CDA|CD/DVD and digital audio: ASPICDA.SYS (when present)
Option=off|Load selected drivers into upper memory (DEVICEHIGH)|HIGH
Option=off|exFAT drives: EXFAT.SYS with EXFMT and EXCHK

[Detect]
TAPE=ASPISCAN.COM /Q /TAPE
DISK=ASPISCAN.COM /Q /DISK
FDD=ASPISCAN.COM /Q /FDD
CDA=ASPISCAN.COM /Q /CDA
WIN3X=WINCHECK.COM /Q /3X
WIN9X=WINCHECK.COM /Q /9X

[Find]
ASPITAP=ASPITAP.SYS
ASPIDSK=ASPIDSK.SYS
ASPIFDD=ASPIFDD.SYS
ASPICDA=ASPICDA.SYS
CDEX=SHSUCDX.COM SHSUCDX.EXE MSCDEX.EXE NWCDEX.EXE

[Files]
README.TXT=OPENASPI.TXT
LICENSE.TXT
ASPISCAN.COM
ASPIMGR.EXE
ASPICTL.EXE
EJECT.EXE
CLOSE.EXE
LOCK.EXE
UNLOCK.EXE
STATUS.EXE
ASPIFMT.EXE
ASPIDD.EXE
ASPIDDG.EXE
TAPECTL.COM
OTAPINFO.EXE
WINCHECK.COM
WINCHECK.EXE
SHSUCDX.COM
CDAUDIO.COM
SHSUCD.LIC
SHSUCD.TXT
6|EXFAT.SYS
6|EXFMT.EXE
6|EXCHK.EXE

[Config.sys]
Remove=ASPITAP.SYS
Remove=ASPIDSK.SYS
Remove=ASPIFDD.SYS
Remove=ASPICDA.SYS
Remove=EXFAT.SYS
Add=1,?ASPITAP|DEVICE%O5%=%ASPITAP%
Add=2,?ASPIDSK|DEVICE%O5%=%ASPIDSK%
Add=3,?ASPIFDD|DEVICE%O5%=%ASPIFDD%
Add=4,?ASPICDA,?CDEX|DEVICE%O5%=%ASPICDA% /D:ASPICDA0
; after ASPIDSK and ASPIFDD: EXFAT.SYS takes their exFAT media over
Add=6|DEVICE%O5%=%DIR%\EXFAT.SYS
Position=bottom

[Autoexec.bat]
Program=4,?ASPICDA,?CDEX|MSCDEX,NWCDEX,SHSUCDX|%CDEX%
Extend=4,?ASPICDA,?CDEX|MSCDEX,NWCDEX,SHSUCDX| /D:ASPICDA0|%CDEX% /D:ASPICDA0
Position=bottom
